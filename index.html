<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Portfolio COP</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fa;color:#183044;margin:0}header{background:#163d54;color:white;padding:24px}main{max-width:850px;margin:40px auto;padding:24px}.panel{background:white;border-radius:14px;padding:25px;box-shadow:0 3px 20px #0001}input,button{padding:12px;border-radius:8px;margin:6px 0}input{border:1px solid #ccc;width:95%}button{background:#176b77;color:white;border:0;cursor:pointer}.muted{color:#657581}.item{padding:14px;border:1px solid #dde5ea;border-radius:10px;margin-top:12px}</style></head><body><header><h1>Portfolio clinique COP</h1><p>Accompagnement des étudiants A3 et A4</p></header><main><div class="panel"><h2 id="heading">Connexion</h2><div id="login"><label>Adresse e-mail<input type="email" id="email" autocomplete="email"></label><label>Mot de passe<input type="password" id="password" autocomplete="current-password"></label><button id="signin">Se connecter</button><p id="message" role="status"></p></div><div id="dashboard" hidden><p id="welcome"></p><div id="content"></div><button id="signout">Se déconnecter</button></div><p class="muted">Autoévaluation : auto-positionnement personnel, non certification COP.</p></div></main><script type="module" src="./src/main.js"></script></body></html>
